<script>
  /* =========================================================
     1. 文章数据 —— 想加文章就在这里加一条
     ========================================================= */
  let POSTS = [];
  const FALLBACK_POSTS = [
    {
      slug: 'css-design-tokens',
      title: '用 CSS 变量搭一套自己的设计系统',
      excerpt: '与其在每个组件里重复写颜色值,不如先把它们抽成一组可维护的变量。这是我这两年最受益的一个小习惯。',
      date: '2025-06-18',
      readTime: 8,
      tags: ['CSS', '设计'],
      content: `
      <p>刚开始写前端的时候,我的样式表里到处都是 <code>#3b82f6</code> 这样的颜色值。改一次主题色,得全局搜索替换几十处,还经常漏掉藏在某个角落里的那一行。</p>
      <p>后来我学会了把设计决策抽成变量:</p>
      <pre><code>:root {
  --color-brand: #2563eb;
  --color-bg: #faf9f7;
  --radius-md: 12px;
  --space-4: 16px;
}</code></pre>
      <p>这一步带来的好处远不止「方便换色」。当你被迫给每个值起一个名字时,你其实是在思考:这套视觉语言的规则到底是什么?</p>
      <blockquote>命名是设计的一部分,不是实现的附属品。</blockquote>
      <h2>分两层:原始值与语义值</h2>
      <p>再往后一步,我会把变量分成两层。第一层是原始调色板,第二层是语义变量:</p>
      <pre><code>:root {
  /* 原始值 */
  --blue-500: #2563eb;
  --gray-50: #faf9f7;

  /* 语义值 */
  --color-bg: var(--gray-50);
  --color-accent: var(--blue-500);
}</code></pre>
      <p>这样切换主题时,你只需要重新映射第二层,组件代码一行都不用改。暗色模式、品牌换色、甚至节日限定皮肤,都变成了十几行 CSS 的事。</p>
      <h2>什么时候不该用变量</h2>
      <p>也别走火入魔。只出现一次、且没有复用意义的值,直接写就好。变量是用来表达「这套系统里的规则」的,不是用来给每个数字取名的。</p>
      <p>判断标准很简单:如果这个值明天要改,我需要改几个地方?超过一个,就该抽出来。</p>
    `
    }
  ];

  /* =========================================================
     2. 文章加载与 Markdown 渲染
     ========================================================= */
  const mdEscape = value => String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));

  function inlineMarkdown(value) {
    let text = mdEscape(value);
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
      (_, alt, src, title) => `<img src="${mdEscape(src)}" alt="${mdEscape(alt)}"${title ? ` title="${mdEscape(title)}"` : ''}>`);
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    text = text.replace(/_([^_]+)_/g, '<em>$1</em>');
    return text;
  }

  function markdownToHtml(markdown) {
    const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
    const html = [];
    let paragraph = [];
    let listType = null;
    let inCode = false;
    let codeLanguage = '';
    let codeLines = [];

    const flushParagraph = () => {
      if (paragraph.length) {
        html.push(`<p>${inlineMarkdown(paragraph.join(' '))}</p>`);
        paragraph = [];
      }
    };
    const closeList = () => {
      if (listType) {
        html.push(`</${listType}>`);
        listType = null;
      }
    };

    lines.forEach(line => {
      if (inCode) {
        if (/^```/.test(line)) {
          const className = codeLanguage ? ` class="language-${mdEscape(codeLanguage)}"` : '';
          html.push(`<pre><code${className}>${mdEscape(codeLines.join('\n'))}</code></pre>`);
          inCode = false;
          codeLines = [];
        } else {
          codeLines.push(line);
        }
        return;
      }
      const fence = line.match(/^```\s*([\w-]*)/);
      if (fence) {
        flushParagraph();
        closeList();
        inCode = true;
        codeLanguage = fence[1];
        return;
      }
      if (!line.trim()) {
        flushParagraph();
        closeList();
        return;
      }
      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      if (heading) {
        flushParagraph();
        closeList();
        const level = heading[1].length;
        html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
        return;
      }
      if (/^>\s?/.test(line)) {
        flushParagraph();
        closeList();
        html.push(`<blockquote>${inlineMarkdown(line.replace(/^>\s?/, ''))}</blockquote>`);
        return;
      }
      const listItem = line.match(/^\s*[-*+]\s+(.+)$/);
      const orderedItem = line.match(/^\s*\d+\.\s+(.+)$/);
      if (listItem || orderedItem) {
        flushParagraph();
        const nextType = orderedItem ? 'ol' : 'ul';
        if (listType !== nextType) {
          closeList();
          html.push(`<${nextType}>`);
          listType = nextType;
        }
        html.push(`<li>${inlineMarkdown((listItem || orderedItem)[1])}</li>`);
        return;
      }
      if (/^---+$/.test(line.trim())) {
        flushParagraph();
        closeList();
        html.push('<hr>');
        return;
      }
      closeList();
      paragraph.push(line.trim());
    });

    if (inCode) {
      html.push(`<pre><code>${mdEscape(codeLines.join('\n'))}</code></pre>`);
    }
    flushParagraph();
    closeList();
    return html.join('');
  }

  function postFromMarkdown(markdown, path) {
    const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
    const titleLine = lines.find(line => /^#\s+/.test(line));
    const title = titleLine ? titleLine.replace(/^#\s+/, '').trim() : path;
    const metadataLine = lines.find(line => /^\s*-\s+/.test(line) && /#/.test(line));
    const dateMatch = metadataLine && metadataLine.match(/(\d{4}-?\d{1,2}-?\d{1,2}|\d{4} 年 \d{1,2} 月 \d{1,2} 日)/);
    const readTimeMatch = metadataLine && metadataLine.match(/(\d+)\s*分钟阅读/);
    const tags = metadataLine ? [...metadataLine.matchAll(/#([^\s#]+)/g)].map(match => match[1]) : [];
    const rawDate = dateMatch && dateMatch[1];
    const date = rawDate
      ? (rawDate.match(/^(\d{4}) 年 (\d{1,2}) 月 (\d{1,2}) 日$/)
        ? rawDate.replace(/^(\d{4}) 年 (\d{1,2}) 月 (\d{1,2}) 日$/, '$1-$2-$3')
        : rawDate.replace(/(\d{4})-?(\d{1,2})-?(\d{1,2})/, '$1-$2-$3'))
      : '1970-01-01';
    const contentLines = lines.filter((line, index) => index !== lines.indexOf(titleLine) && line !== metadataLine);
    const content = markdownToHtml(contentLines.join('\n'));
    const firstParagraph = contentLines.find(line => line.trim() && !/^[-#>`]/.test(line.trim()));
    const slug = path.split('/').pop().replace(/\.md$/i, '');
    return {
      slug,
      title,
      excerpt: firstParagraph ? firstParagraph.trim() : '暂无摘要',
      date,
      readTime: readTimeMatch ? Number(readTimeMatch[1]) : 1,
      tags,
      content
    };
  }

  async function loadPosts() {
    try {
      const manifestResponse = await fetch('mdwd/index.json', { cache: 'no-cache' });
      if (!manifestResponse.ok) throw new Error(`文章清单加载失败 (${manifestResponse.status})`);
      const paths = await manifestResponse.json();
      if (!Array.isArray(paths)) throw new Error('文章清单格式必须是数组');
      const results = await Promise.all(paths.map(async path => {
        const response = await fetch(`mdwd/${path}`, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`${path} 加载失败 (${response.status})`);
        return postFromMarkdown(await response.text(), path);
      }));
      POSTS = results;
    } catch (error) {
      console.error('无法加载 mdwd 中的文章:', error);
      POSTS = FALLBACK_POSTS;
    }
    renderTags();
    renderPosts();
    renderRecent();
  }

  /* =========================================================
     3. 工具函数
     ========================================================= */
  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  }

  function formatShortDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  }

  const sortedPosts = () => POSTS.slice().sort((a, b) => b.date.localeCompare(a.date));

  /* =========================================================
     3. 状态
     ========================================================= */
  const state = {
    query: '',
    tag: null
  };

  /* =========================================================
     4. 渲染:文章列表
     ========================================================= */
  const postListEl   = document.getElementById('postList');
  const emptyStateEl = document.getElementById('emptyState');

  function renderPosts() {
    const q = state.query.trim().toLowerCase();

    const filtered = sortedPosts().filter(post => {
      const matchTag = !state.tag || post.tags.includes(state.tag);
      const haystack = (post.title + post.excerpt + post.tags.join(' ')).toLowerCase();
      const matchQuery = !q || haystack.includes(q);
      return matchTag && matchQuery;
    });

    if (filtered.length === 0) {
      postListEl.innerHTML = '';
      emptyStateEl.hidden = false;
      return;
    }

    emptyStateEl.hidden = true;
    postListEl.innerHTML = filtered.map((post, i) => `
    <article class="post-card"
             data-slug="${post.slug}"
             tabindex="0"
             role="button"
             aria-label="阅读文章:${post.title}"
             style="animation-delay:${i * 55}ms">
      <div class="post-card-head">
        <time datetime="${post.date}">${formatDate(post.date)}</time>
        <span class="dot"></span>
        <span>${post.readTime} 分钟阅读</span>
      </div>
      <h2>${post.title}</h2>
      <p class="excerpt">${post.excerpt}</p>
      <div class="post-card-foot">
        <div class="tags">
          ${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <span class="read-more">阅读全文 →</span>
      </div>
    </article>
  `).join('');
  }

  /* 事件委托:点击 / 回车打开文章 */
  postListEl.addEventListener('click', e => {
    const card = e.target.closest('.post-card');
    if (card) openPost(card.dataset.slug);
  });

  postListEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.post-card');
    if (card) {
      e.preventDefault();
      openPost(card.dataset.slug);
    }
  });

  /* =========================================================
     5. 渲染:标签筛选 + 标签云
     ========================================================= */
  const tagFilterEl = document.getElementById('tagFilter');
  const tagCloudEl  = document.getElementById('tagCloud');

  function collectTags() {
    const map = new Map();
    POSTS.forEach(p => p.tags.forEach(t => map.set(t, (map.get(t) || 0) + 1)));
    return [...map.entries()].sort((a, b) => b[1] - a[1]);
  }

  function renderTags() {
    const tags = collectTags();

    // 筛选条:全部 + 各标签
    tagFilterEl.innerHTML = `
    <button class="chip ${state.tag === null ? 'active' : ''}" data-tag="">全部</button>
    ${tags.map(([t]) => `
      <button class="chip ${state.tag === t ? 'active' : ''}" data-tag="${t}">${t}</button>
    `).join('')}
  `;

    // 侧栏标签云
    tagCloudEl.innerHTML = tags.map(([t, n]) => `
    <button data-tag="${t}">${t}<small>${n}</small></button>
  `).join('');
  }

  tagFilterEl.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    state.tag = btn.dataset.tag || null;
    renderTags();
    renderPosts();
  });

  tagCloudEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.tag = state.tag === btn.dataset.tag ? null : btn.dataset.tag;
    renderTags();
    renderPosts();
    document.getElementById('posts').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* =========================================================
     6. 渲染:侧栏最近更新
     ========================================================= */
  const recentListEl = document.getElementById('recentList');

  function renderRecent() {
    recentListEl.innerHTML = sortedPosts().slice(0, 4).map(p => `
    <li>
      <button data-slug="${p.slug}">
        ${p.title}
        <time datetime="${p.date}">${formatShortDate(p.date)}</time>
      </button>
    </li>
  `).join('');
  }

  recentListEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) openPost(btn.dataset.slug);
  });

  /* =========================================================
     7. 搜索
     ========================================================= */
  const searchInput = document.getElementById('searchInput');
  let searchTimer = null;

  searchInput.addEventListener('input', e => {
    clearTimeout(searchTimer);
    const value = e.target.value;
    searchTimer = setTimeout(() => {
      state.query = value;
      renderPosts();
    }, 140);
  });

  /* =========================================================
     8. 视图切换:列表 <-> 详情
     ========================================================= */
  const homeView   = document.getElementById('homeView');
  const postView   = document.getElementById('postView');
  const postTitle  = document.getElementById('postTitle');
  const postMeta   = document.getElementById('postMeta');
  const postContent = document.getElementById('postContent');
  const progressBar = document.getElementById('progressBar');

  const DEFAULT_TITLE = document.title;

  function openPost(slug) {
    const post = POSTS.find(p => p.slug === slug);
    if (!post) return;

    postTitle.textContent = post.title;

    postMeta.innerHTML = `
    <time datetime="${post.date}">${formatDate(post.date)}</time>
    <span class="dot"></span>
    <span>${post.readTime} 分钟阅读</span>
    <span class="dot"></span>
    <span>${post.tags.map(t => `#${t}`).join('  ')}</span>
  `;

    postContent.innerHTML = post.content;
    document.title = `${post.title} · Wywhpsmaq`;

    homeView.hidden = true;
    postView.hidden = false;
    progressBar.classList.add('active');

    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    updateProgress();
  }

  function goHome() {
    postView.hidden = true;
    homeView.hidden = false;
    document.title = DEFAULT_TITLE;
    progressBar.classList.remove('active');
    progressBar.style.width = '0';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('backBtn2').addEventListener('click', goHome);

  /* 浏览器前进/后退时也能返回列表 */
  window.addEventListener('popstate', () => {
    if (!postView.hidden) goHome();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !postView.hidden) goHome();
  });

  /* =========================================================
     9. 阅读进度条
     ========================================================= */
  function updateProgress() {
    if (postView.hidden) return;
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    progressBar.style.width = Math.min(percent, 100) + '%';
  }

  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);

  /* =========================================================
     10. 主题切换
     ========================================================= */
  const themeToggle = document.getElementById('themeToggle');
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    try { localStorage.setItem('blog-theme', theme); } catch (e) {}
  }

  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  /* 监听系统主题变化(用户未手动设置过时) */
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    let saved = null;
    try { saved = localStorage.getItem('blog-theme'); } catch (err) {}
    if (!saved) applyTheme(e.matches ? 'dark' : 'light');
  });

  /* =========================================================
     11. 初始化
     ========================================================= */
  renderPosts();
  loadPosts();
</script>
<script src="particles.js"></script>

</body>
</html>
